<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <alias binding="same">
        <family>sans-serif</family>
        <prefer>
            <family>Iosevka Nerd Font</family>
            <family>UbuntuSans Nerd Font</family>
            <family>Noto Color Emoji</family>
        </prefer>
    </alias>

    <alias binding="same">
        <family>sans</family>
        <prefer>
            <family>Iosevka Nerd Font</family>
            <family>UbuntuSans Nerd Font</family>
            <family>Noto Color Emoji</family>
        </prefer>
    </alias>

    <alias binding="same">
        <family>monospace</family>
        <prefer>
            <family>JetBrainsMono Nerd Font Mono</family>
            <family>Iosevka Nerd Font Mono</family>
            <family>Noto Color Emoji</family>
            <family>Braille</family>
        </prefer>
    </alias>

    <!-- Fallback de glifos: los iconos Nerd Font caen acá cuando la fuente del sitio no los tiene -->
    <match target="pattern">
        <edit name="family" mode="append_last">
            <string>Symbols Nerd Font Mono</string>
        </edit>
        <edit name="family" mode="append_last">
            <string>Symbols Nerd Font</string>
        </edit>
    </match>
</fontconfig>
